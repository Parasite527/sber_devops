apiVersion: v1
kind: Pod
metadata:
  name: custom-app-pod
  labels:
    app: custom-app
spec:
  containers:
    - name: app
      imagePullPolicy: Never
      image: custom-app-image
      ports:
        - containerPort: 5000
      envFrom:
        - configMapRef:
            name: custom-app-config
      volumeMounts:
        - name: logs-volume
          mountPath: /app/logs
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
      
  volumes:
    - name: logs-volume
      emptyDir: {}