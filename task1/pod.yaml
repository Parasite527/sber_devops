apiVersion: v1
kind: Pod
metadata:
  name: custom-app-pod
  labels:
    app: custom-app
spec:
  containers:
    - name: app
      imagePullPolicy: Never
      image: custom-app-image
      ports:
        - containerPort: 5000
      envFrom:
        - configMapRef:
            name: custom-app-config
      volumeMounts:
        - name: logs-volume
          mountPath: /app/logs
      
  volumes:
    - name: logs-volume
      emptyDir: {}